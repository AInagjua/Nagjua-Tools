<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Personal Documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #16243a;
    --navy-dark: #0d1726;
    --gold: #c8a24a;
    --gold-light: #e8d5a3;
    --line: #e3e7ee;
    --bg: #eef1f6;
    --card: #ffffff;
    --text: #1c2530;
    --muted: #7c8494;
    --danger: #c0392b;
    --ok: #1d8348;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(circle at top right, #f4ecd8 0%, var(--bg) 45%);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color: #fff;
    padding: 32px 40px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 4px 20px rgba(13,23,38,.25);
    position: relative;
  }
  header::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
  }
  .header-text { display: flex; align-items: center; gap: 14px; }
  .header-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(200,162,74,.18); border: 1px solid rgba(200,162,74,.4);
    display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
  header p { margin: 2px 0 0; color: #a9b6c9; font-size: 0.85rem; }
  main {
    max-width: 820px;
    margin: 32px auto 60px;
    padding: 0 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 26px 28px;
    margin-bottom: 22px;
    box-shadow: 0 2px 8px rgba(22,36,58,.04), 0 10px 30px rgba(22,36,58,.03);
    transition: box-shadow .2s ease;
  }
  .card:hover { box-shadow: 0 2px 8px rgba(22,36,58,.06), 0 14px 36px rgba(22,36,58,.06); }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .card-head-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0; }
  .card-head-row .card-head { margin-bottom: 0; }
  .toggle-btn {
    background: none; border: 1.5px solid var(--navy); color: var(--navy);
    padding: 7px 18px; border-radius: 7px; font-size: 0.8rem; cursor: pointer; font-weight: 600;
    font-family: inherit; margin-top: 0; transition: background .15s ease, color .15s ease;
  }
  .toggle-btn:hover { background: var(--navy); color: #fff; }

  .viewer-overlay {
    position: fixed; inset: 0; background: rgba(13,23,38,.85);
    display: none; align-items: center; justify-content: center; z-index: 10000;
    padding: 24px;
  }
  .viewer-overlay.open { display: flex; }
  .viewer-box {
    background: #fff; border-radius: 12px; width: 100%; max-width: 900px; height: 90vh;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .viewer-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .viewer-header .name { font-weight: 600; font-size: 0.92rem; color: var(--navy); }
  .viewer-close {
    background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--muted);
    margin-top: 0; padding: 2px 8px; line-height: 1;
  }
  .viewer-close:hover { color: var(--text); }
  .viewer-frame { flex: 1; border: none; width: 100%; background: #525659; }
  .card-num {
    width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: var(--gold-light);
    display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700; flex-shrink: 0;
  }
  .card h2 { margin: 0; font-size: 1.08rem; color: var(--navy); font-weight: 700; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; margin-top: 16px; font-weight: 500; }
  label:first-of-type { margin-top: 0; }
  select, input[type="text"], input[type="file"] {
    width: 100%; padding: 11px 13px; border: 1.5px solid var(--line);
    border-radius: 8px; font-size: 0.92rem; background: #fbfcfe; font-family: inherit;
    transition: border-color .15s ease, background .15s ease;
  }
  select:focus, input[type="text"]:focus {
    outline: none; border-color: var(--gold); background: #fff;
  }
  input[type="file"] { padding: 9px 13px; cursor: pointer; }
  button {
    margin-top: 18px; padding: 11px 22px; background: var(--navy); color: #fff;
    border: none; border-radius: 8px; font-size: 0.9rem; cursor: pointer; font-weight: 600;
    transition: background .15s ease, transform .1s ease; font-family: inherit;
  }
  button:hover { background: var(--navy-dark); }
  button:active { transform: scale(0.98); }
  button:disabled { background: #b7bec9; cursor: not-allowed; }
  .msg { margin-top: 12px; font-size: 0.85rem; font-weight: 500; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--ok); }
  .doc-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 4px; border-bottom: 1px solid var(--line);
  }
  .doc-row:last-child { border-bottom: none; }
  .doc-row:hover { background: #fafbfd; margin: 0 -4px; padding: 14px 8px; border-radius: 8px; }
  .doc-row-inner { display: flex; align-items: center; }

  .doc-info .name { font-weight: 600; font-size: 0.93rem; }
  .doc-info .meta { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
  .doc-actions a, .doc-actions button {
    margin-top: 0; margin-left: 8px; font-size: 0.8rem; padding: 7px 14px; border-radius: 7px;
  }
  .doc-actions .op { background: #fff; color: var(--navy); border: 1.5px solid var(--navy); }
  .doc-actions .op:hover { background: #f3f5f8; }
  .doc-actions .del { background: #fff; color: var(--danger); border: 1.5px solid #f0d4cf; }
  .doc-actions .del:hover { background: #fdf1ef; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 18px 4px; text-align: center; }

  .login-overlay {
    position: fixed; inset: 0;
    background: linear-gradient(160deg, var(--navy-dark) 0%, var(--navy) 100%);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  .login-box {
    background: #fff; border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .login-icon {
    width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--navy), var(--navy-dark));
    display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
  }
  .login-box h2 { margin: 0 0 6px; color: var(--navy); font-size: 1.25rem; text-align: center; font-weight: 700; }
  .login-box p { margin: 0 0 22px; color: var(--muted); font-size: 0.86rem; text-align: center; }
  .login-box input {
    width: 100%; padding: 11px 13px; margin-bottom: 12px; border: 1.5px solid var(--line);
    border-radius: 8px; font-size: 0.9rem; font-family: inherit;
  }
  .login-box input:focus { outline: none; border-color: var(--gold); }
  .login-box button { width: 100%; margin-top: 4px; }
  .login-error { color: var(--danger); font-size: 0.8rem; margin: -6px 0 12px; display: none; text-align: center; }
  .logout-btn {
    position: fixed; top: 18px; right: 20px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25);
    border-radius: 8px; padding: 8px 16px; font-size: 0.8rem; cursor: pointer; color: #fff; font-weight: 500;
    z-index: 100; backdrop-filter: blur(4px); transition: background .15s ease;
  }
  .logout-btn:hover { background: rgba(255,255,255,.18); }
</style>
</head>
<body>

<div id="loginOverlay" class="login-overlay">
  <div class="login-box">
    <h2>Personal Documents</h2>
    <p>Sign in to access your personal documents.</p>
    <div id="loginError" class="login-error">Incorrect email or password, or this account isn't authorized.</div>
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" />
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" />
    <button id="loginBtn">Sign In</button>
  </div>
</div>
<button id="logoutBtn" class="logout-btn" style="display:none;">Sign out</button>

<div id="mainWrap" style="display:none;">

<header>
  <div class="header-text">
    <div class="header-icon">📁</div>
    <div>
      <h1>Personal Documents</h1>
    </div>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-head"><div class="card-num">1</div><h2>Search Documents</h2></div>
    <label for="docSearch">Find a document</label>
    <input type="text" id="docSearch" placeholder="Search by category, label, or file name…" />
  </div>

  <div class="card">
    <div class="card-head-row">
      <div class="card-head"><div class="card-num">2</div><h2>Upload a Document</h2></div>
      <button id="uploadToggle" class="toggle-btn" type="button">Show</button>
    </div>
    <div id="uploadPanel" style="display:none">
      <label for="docFile">File (PDF or image, up to 100 MB)</label>
      <input type="file" id="docFile" accept="application/pdf,image/*" />

      <label for="docPassword">Password to open this document (optional)</label>
      <input type="text" id="docPassword" placeholder="Leave blank for no password" />

      <button id="uploadBtn">Upload</button>
      <div id="uploadMsg" class="msg"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head-row">
      <div class="card-head"><div class="card-num">3</div><h2>Access Documents</h2></div>
      <button id="accessToggle" class="toggle-btn" type="button">Show</button>
    </div>
    <div id="accessPanel" style="display:none">
      <div id="docList"><div class="empty">Loading…</div></div>
    </div>
  </div>
</main>

</div>

<div id="viewerOverlay" class="viewer-overlay">
  <div class="viewer-box">
    <div class="viewer-header">
      <span class="name" id="viewerName"></span>
      <button type="button" class="viewer-close" id="viewerClose">✕</button>
    </div>
    <iframe id="viewerFrame" class="viewer-frame"></iframe>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, inMemoryPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyADkd67rBpQyHTeZkFapixW1tBu_zZUG0c",
  authDomain: "transaction-search-ng.firebaseapp.com",
  projectId: "transaction-search-ng",
  storageBucket: "transaction-search-ng.firebasestorage.app",
  messagingSenderId: "913327997399",
  appId: "1:913327997399:web:e1f777f9aae176d94e8b92"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
setPersistence(auth, inMemoryPersistence);

// This tool is for one account only, by design - personal documents are
// not shared with the rest of the team's tools.
const ALLOWED_EMAILS = ["ai@nagjua.com", "nagjua@yahoo.com"];
// Large files are split into chunks behind the scenes (each chunk stored as
// its own Firestore document, since a single document is capped at 1MB) and
// reassembled on download. CHUNK_SIZE is the raw bytes per chunk - kept
// under 1MB after base64 encoding inflates it by ~33%. MAX_BYTES is an
// overall sanity cap so one file can't eat too much of the free quota.
const CHUNK_SIZE = 700 * 1024;
const MAX_BYTES = 100 * 1024 * 1024;

const loginOverlay = document.getElementById('loginOverlay');
const mainWrap = document.getElementById('mainWrap');
const logoutBtn = document.getElementById('logoutBtn');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const uploadBtn = document.getElementById('uploadBtn');
const uploadMsg = document.getElementById('uploadMsg');
const docList = document.getElementById('docList');
const docSearch = document.getElementById('docSearch');
docSearch.addEventListener('input', () => {
  renderDocuments(docSearch.value);
  // Access Documents is collapsed by default - without this, typing here
  // updates a list the user can't see at all.
  if (docSearch.value.trim()) {
    const accessPanel = document.getElementById('accessPanel');
    const accessToggle = document.getElementById('accessToggle');
    if (accessPanel.style.display === 'none') {
      accessPanel.style.display = 'block';
      accessToggle.textContent = 'Hide';
    }
  }
});

function wireToggle(btnId, panelId) {
  const btn = document.getElementById(btnId);
  const panel = document.getElementById(panelId);
  btn.addEventListener('click', () => {
    const willShow = panel.style.display === 'none';
    panel.style.display = willShow ? 'block' : 'none';
    btn.textContent = willShow ? 'Hide' : 'Show';
  });
}
wireToggle('uploadToggle', 'uploadPanel');
wireToggle('accessToggle', 'accessPanel');



let currentUser = null;

loginBtn.addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  loginError.style.display = 'none';
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (e) {
    loginError.textContent = "Incorrect email or password.";
    loginError.style.display = 'block';
  }
});

logoutBtn.addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async (user) => {
  if (user && ALLOWED_EMAILS.includes((user.email || '').toLowerCase())) {
    currentUser = user;
    loginOverlay.style.display = 'none';
    mainWrap.style.display = '';
    logoutBtn.style.display = '';
    await loadDocuments();
  } else if (user) {
    loginError.textContent = "This account isn't authorized for this tool.";
    loginError.style.display = 'block';
    signOut(auth);
  } else {
    currentUser = null;
    loginOverlay.style.display = 'flex';
    mainWrap.style.display = 'none';
    logoutBtn.style.display = 'none';
  }
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result); // data URL, e.g. "data:application/pdf;base64,...."
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

function fmtDate(ts) {
  if (!ts || !ts.toDate) return '';
  return ts.toDate().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

async function uploadFileInChunks(file, groupId, onProgress) {
  const chunkCount = Math.ceil(file.size / CHUNK_SIZE) || 1;
  for (let i = 0; i < chunkCount; i++) {
    const start = i * CHUNK_SIZE;
    const end = Math.min(start + CHUNK_SIZE, file.size);
    const blobChunk = file.slice(start, end);
    const dataUrl = await fileToBase64(blobChunk);
    const base64Only = dataUrl.split(',')[1] || '';
    await setDoc(doc(db, 'personalDocumentChunks', `${groupId}_${i}`), { data: base64Only });
    if (onProgress) onProgress(i + 1, chunkCount);
  }
  return chunkCount;
}

uploadBtn.addEventListener('click', async () => {
  const fileInput = document.getElementById('docFile');
  const passwordInput = document.getElementById('docPassword');
  const file = fileInput.files[0];
  const password = passwordInput.value;
  uploadMsg.textContent = '';
  uploadMsg.className = 'msg';

  if (!file) {
    uploadMsg.textContent = 'Choose a file first.';
    uploadMsg.className = 'msg error';
    return;
  }
  if (file.size > MAX_BYTES) {
    uploadMsg.textContent = `File is ${fmtBytes(file.size)} - please keep it under ${fmtBytes(MAX_BYTES)}.`;
    uploadMsg.className = 'msg error';
    return;
  }

  uploadBtn.disabled = true;
  try {
    const groupId = 'doc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    const chunkCount = await uploadFileInChunks(file, groupId, (done, total) => {
      uploadMsg.textContent = total > 1 ? `Uploading… (${done}/${total})` : 'Uploading…';
      uploadMsg.className = 'msg';
    });
    await setDoc(doc(db, 'personalDocuments', groupId), {
      owner: currentUser.email,
      fileName: file.name,
      mimeType: file.type || 'application/octet-stream',
      size: file.size,
      chunkCount,
      password: password || null,
      uploadedAt: serverTimestamp()
    });
    uploadMsg.textContent = 'Uploaded.';
    uploadMsg.className = 'msg ok';
    fileInput.value = '';
    passwordInput.value = '';
    await loadDocuments();
  } catch (e) {
    uploadMsg.textContent = 'Upload failed: ' + e.message;
    uploadMsg.className = 'msg error';
  } finally {
    uploadBtn.disabled = false;
  }
});

let allDocuments = [];

async function loadDocuments() {
  docList.innerHTML = '<div class="empty">Loading…</div>';
  const snap = await getDocs(collection(db, 'personalDocuments'));
  const items = [];
  snap.forEach(d => items.push({ id: d.id, ...d.data() }));
  items.sort((a, b) => (b.uploadedAt?.seconds || 0) - (a.uploadedAt?.seconds || 0));
  allDocuments = items;
  renderDocuments(docSearch.value);
}

function renderDocuments(filterText) {
  const q = (filterText || '').trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  const items = words.length === 0 ? allDocuments : allDocuments.filter(it => {
    const haystack = [it.category, it.label, it.fileName].filter(Boolean).join(' ').toLowerCase();
    return words.every(w => haystack.includes(w));
  });

  if (allDocuments.length === 0) {
    docList.innerHTML = '<div class="empty">No documents uploaded yet.</div>';
    return;
  }
  if (items.length === 0) {
    docList.innerHTML = '<div class="empty">No documents match your search.</div>';
    return;
  }

  docList.innerHTML = items.map(it => `
    <div class="doc-row" data-id="${it.id}">
      <div class="doc-row-inner">
        <div class="doc-info">
          <div class="name">${it.category ? escapeHtml(it.category) + (it.label ? ' — ' + escapeHtml(it.label) : '') : escapeHtml(it.fileName || 'Document')}</div>
          <div class="meta">${escapeHtml(it.fileName || '')} · ${fmtBytes(it.size || 0)} · ${fmtDate(it.uploadedAt)}</div>
        </div>
      </div>
      <div class="doc-actions">
        <button class="op" data-id="${it.id}">Open</button>
        <button class="del" data-id="${it.id}">Delete</button>
      </div>
    </div>
  `).join('');

  function checkPassword(item) {
    if (!item.password) return true;
    const entered = prompt('This document is password protected. Enter the password:');
    if (entered === null) return false; // cancelled
    if (entered !== item.password) {
      alert('Incorrect password.');
      return false;
    }
    return true;
  }

  docList.querySelectorAll('.op').forEach(btn => {
    btn.addEventListener('click', async () => {
      const item = allDocuments.find(d => d.id === btn.dataset.id);
      if (!item) return;
      if (!checkPassword(item)) return;
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Opening…';
      try {
        const blob = await buildDocumentBlob(item);
        const url = URL.createObjectURL(blob);
        showViewer(item.fileName || 'Document', url);
      } catch (e) {
        alert('Open failed: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = original;
      }
    });
  });

  docList.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Delete this document? This cannot be undone.')) return;
      const item = allDocuments.find(d => d.id === btn.dataset.id);
      const deletes = [deleteDoc(doc(db, 'personalDocuments', btn.dataset.id))];
      if (item) {
        for (let i = 0; i < (item.chunkCount || 1); i++) {
          deletes.push(deleteDoc(doc(db, 'personalDocumentChunks', `${item.id}_${i}`)));
        }
      }
      await Promise.all(deletes);
      await loadDocuments();
    });
  });
}

const viewerOverlay = document.getElementById('viewerOverlay');
const viewerFrame = document.getElementById('viewerFrame');
const viewerName = document.getElementById('viewerName');
const viewerClose = document.getElementById('viewerClose');
let viewerCurrentUrl = null;

function showViewer(name, url) {
  viewerName.textContent = name;
  viewerFrame.src = url;
  viewerCurrentUrl = url;
  viewerOverlay.classList.add('open');
}

function closeViewer() {
  viewerOverlay.classList.remove('open');
  viewerFrame.src = '';
  if (viewerCurrentUrl) {
    URL.revokeObjectURL(viewerCurrentUrl);
    viewerCurrentUrl = null;
  }
}

viewerClose.addEventListener('click', closeViewer);
viewerOverlay.addEventListener('click', (e) => {
  if (e.target === viewerOverlay) closeViewer();
});

async function buildDocumentBlob(item) {
  const chunkCount = item.chunkCount || 1;
  const snaps = await Promise.all(
    Array.from({ length: chunkCount }, (_, i) => getDoc(doc(db, 'personalDocumentChunks', `${item.id}_${i}`)))
  );
  const byteArrays = snaps.map(s => {
    const base64 = s.data().data;
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let j = 0; j < binary.length; j++) bytes[j] = binary.charCodeAt(j);
    return bytes;
  });
  return new Blob(byteArrays, { type: item.mimeType || 'application/octet-stream' });
}

function fileIcon(mimeType) {
  if (!mimeType) return '📄';
  if (mimeType.startsWith('image/')) return '🖼️';
  if (mimeType === 'application/pdf') return '📕';
  return '📄';
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>

</body>
</html>
