<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creditor Report Generator — Nagjua Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root {
    --navy:   #0F172A;
    --navy2:  #1E293B;
    --gold:   #B8860B;
    --gold2:  #F0B429;
    --white:  #FFFFFF;
    --off:    #F8F7F4;
    --border: #E2E0D9;
    --text:   #1E293B;
    --muted:  #64748B;
    --green:  #166534;
    --greenb: #DCFCE7;
    --red:    #991B1B;
    --redb:   #FEE2E2;
    --blue:   #1D4ED8;
    --blueb:  #DBEAFE;
    --radius: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Source Sans 3', sans-serif; background: var(--off); color: var(--text); min-height: 100vh; }

  /* HEADER */
  .header {
    background: var(--navy); color: var(--white);
    padding: 0 40px; display: flex; align-items: center;
    justify-content: space-between; height: 64px;
    border-bottom: 3px solid var(--gold);
  }
  .header-logo { font-family: 'Playfair Display', serif; font-size: 20px; letter-spacing: .5px; }
  .header-logo span { color: var(--gold2); }
  .header-sub { font-size: 12px; color: #94A3B8; letter-spacing: 1px; text-transform: uppercase; }

  /* LAYOUT */
  .page { max-width: 700px; margin: 0 auto; padding: 32px 24px 100px; }

  /* STEP CARD */
  .step { background: var(--white); border-radius: 10px; box-shadow: var(--shadow); margin-bottom: 24px; overflow: hidden; }
  .step-head {
    background: var(--navy); color: var(--white);
    padding: 16px 24px; display: flex; align-items: center; gap: 14px;
  }
  .step-num {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--gold); color: var(--navy);
    font-weight: 700; font-size: 15px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .step-title { font-family: 'Playfair Display', serif; font-size: 18px; }
  .step-desc  { font-size: 13px; color: #94A3B8; margin-top: 2px; }
  .step-body  { padding: 28px 24px; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .field select {
    border: 1.5px solid var(--border); border-radius: var(--radius);
    padding: 9px 12px; font-size: 14px; font-family: inherit;
    color: var(--text); background: var(--white); transition: border .2s;
  }
  .field select:focus { outline: none; border-color: var(--gold); }

  .section-label {
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
    padding: 18px 0 12px; border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .section-label:first-child { padding-top: 0; }

  .company-hint { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .company-hint.ok   { color: var(--green); font-weight: 600; }
  .company-hint.warn { color: #A15C00;    font-weight: 600; }

  /* FILE UPLOAD (matches the cheque-upload pattern used elsewhere in the suite) */
  .upload-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .upload-btn {
    background: var(--navy); color: var(--white); border: none;
    padding: 10px 20px; border-radius: var(--radius);
    font-weight: 600; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .upload-btn:hover { background: var(--navy2); }
  .filename { font-size: 12.5px; color: var(--muted); }

  .gen-btn {
    background: var(--gold); color: var(--white); border: none;
    padding: 12px 32px; border-radius: var(--radius);
    font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: 10px;
    width: 100%; justify-content: center; margin-top: 24px;
  }
  .gen-btn:hover:not(:disabled) { background: var(--gold2); transform: translateY(-1px); }
  .gen-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  /* RESULTS */
  #log { margin-top: 22px; display: none; }
  #log.show { display: block; }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13.5px;
  }
  .row:last-of-type { border-bottom: none; }
  .row span:first-child { color: var(--muted); }
  .row span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; }
  .warn { color: #A15C00; font-weight: 700; }
  .err  { color: var(--red); font-weight: 700; }
  .ok   { color: var(--green); font-weight: 700; }
  .unmapped-list { margin: 6px 0 0; padding-left: 18px; }

  .dl {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 18px; text-align: center; padding: 13px;
    background: var(--gold); color: var(--white); text-decoration: none;
    border-radius: var(--radius); font-weight: 700; font-size: 14px;
    font-family: 'Playfair Display', serif;
  }
  .dl:hover { background: var(--gold2); }

  @media (max-width: 700px) {
    .header { padding: 0 16px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div>
    <div class="header-logo">Nagjua <span>Group</span></div>
    <div class="header-sub">Creditor Report Generator</div>
  </div>
</div>

<div class="page">

  <!-- STEP 1: COMPANY -->
  <div class="step">
    <div class="step-head">
      <div class="step-num">1</div>
      <div>
        <div class="step-title">Company</div>
        <div class="step-desc">Which entity does this Creditor Outstanding ledger belong to?</div>
      </div>
    </div>
    <div class="step-body">
      <div class="field">
        <label>Company</label>
        <select id="company">
          <option value="MMP">MMP — Micromega Projects</option>
          <option value="NLS">NLS — Nagjua Lifespaces</option>
          <option value="SPCT">SPCT — Spring City Developers</option>
        </select>
      </div>
      <div class="company-hint" id="companyHint"></div>
    </div>
  </div>

  <!-- STEP 2: LEDGER FILE -->
  <div class="step">
    <div class="step-head">
      <div class="step-num">2</div>
      <div>
        <div class="step-title">Ledger File</div>
        <div class="step-desc">Upload the raw Creditor Outstanding export, unedited.</div>
      </div>
    </div>
    <div class="step-body">
      <div class="upload-row">
        <input type="file" id="file" accept=".xlsx" style="display:none;" onchange="handleFileSelect(this.files)">
        <button type="button" class="upload-btn" onclick="document.getElementById('file').click()">📄 Choose .xlsx File</button>
        <div class="filename" id="filename">No file selected</div>
      </div>

      <button class="gen-btn" id="go" disabled>Generate structured report</button>
      <div id="log"></div>
    </div>
  </div>

</div>

<script>
const COMPANY_CONFIG = {
  MMP: {
    prefix: 'MMP',
    columns: [
      { label: 'MMP- HO', unit: 'MICROMEGA PROJECTS-HO' },
      { label: 'TG- 1A', unit: 'TROPICAL GREENS PHASE - 1A' },
      { label: 'TG- 1B', unit: 'TROPICAL GREENS PHASE-1B' },
      { label: 'TG- 2A', unit: 'TROPICAL GREENS PHASE - 2A' },
      { label: 'TG- 2B', unit: 'TROPICAL GREENS PHASE - 2B' },
      { label: 'ANANTA', unit: 'NAGJUA ANANTA' }
    ]
  },
  NLS: {
    prefix: 'NLS',
    columns: [
      { label: 'NLS- HO', unit: 'NAGJUA LIFESPACES-HO' },
      { label: 'EP- 1', unit: 'THE ETERNITY PARK PHASE 1' },
      { label: 'EP- 2', unit: 'THE ETERNITY PARK PHASE 2' },
      { label: 'EP- 3', unit: 'THE ETERNITY PARK PHASE 3' },
      { label: 'EP- 4', unit: 'THE ETERNITY PARK PHASE 4' },
      { label: 'SP- 1', unit: 'THE SERENITY PARK PHASE 1' }
    ]
  },
  SPCT: {
    prefix: 'SPCT',
    columns: [
      { label: 'SP- 2', unit: 'SPRING CITY PHASE 2' }
    ]
  }
};

const filenameEl = document.getElementById('filename');
const companyHint = document.getElementById('companyHint');
const companySelect = document.getElementById('company');
const goBtn = document.getElementById('go');
const logEl = document.getElementById('log');
let selectedFile = null;

const COMPANY_NAME_MATCH = [
  { pattern: 'MICROMEGA PROJECTS', key: 'MMP' },
  { pattern: 'NAGJUA LIFESPACES', key: 'NLS' },
  { pattern: 'SPRING CITY DEVELOPERS', key: 'SPCT' }
];

function detectCompanyFromLines(lines) {
  for (const line of lines) {
    const text = String(line[0] || '');
    if (text.trim().startsWith('Company:')) {
      const upper = text.toUpperCase();
      for (const m of COMPANY_NAME_MATCH) {
        if (upper.includes(m.pattern)) return { key: m.key, raw: text.replace('Company:', '').trim() };
      }
      return { key: null, raw: text.replace('Company:', '').trim() };
    }
  }
  return null;
}

async function handleFileSelect(files) {
  selectedFile = files[0] || null;
  filenameEl.textContent = selectedFile ? selectedFile.name : 'No file selected';
  goBtn.disabled = !selectedFile;
  logEl.classList.remove('show');
  logEl.innerHTML = '';
  companyHint.textContent = '';
  companyHint.className = 'company-hint';
  if (!selectedFile) return;
  try {
    const buf = await selectedFile.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const found = findRawSheet(wb);
    if (!found) return;
    const headerLines = trimTrailingBlanks(found.arr.slice(0, found.headerRow));
    const detected = detectCompanyFromLines(headerLines);
    if (detected && detected.key) {
      companySelect.value = detected.key;
      companyHint.textContent = `Detected: ${detected.raw} → ${detected.key}`;
      companyHint.className = 'company-hint ok';
    } else if (detected) {
      companyHint.textContent = `Company line found ("${detected.raw}") but didn't match MMP or NLS — check dropdown.`;
      companyHint.className = 'company-hint warn';
    }
  } catch (e) {
    // detection is best-effort only; ignore failures here, Generate will surface real errors
  }
}

goBtn.addEventListener('click', async () => {
  goBtn.disabled = true;
  goBtn.textContent = 'Generating…';
  logEl.classList.add('show');
  logEl.innerHTML = '';
  try {
    const companyKey = document.getElementById('company').value;
    const buf = await selectedFile.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const result = await generate(wb, companyKey);
    await buildAndOffer(result, companyKey, selectedFile.name);
  } catch (e) {
    logRow('Error', e.message, 'err');
    console.error(e);
  } finally {
    goBtn.disabled = false;
    goBtn.textContent = 'Generate structured report';
  }
});

function logRow(label, value, cls) {
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = `<span>${label}</span><span class="${cls||''}">${value}</span>`;
  logEl.appendChild(div);
}

function excelSerialFromDMY(day, month, year) {
  if (year < 100) year += 2000;
  const utcMs = Date.UTC(year, month - 1, day);
  const epochMs = Date.UTC(1899, 11, 30);
  return Math.round((utcMs - epochMs) / 86400000);
}

function findHeaderRow(sheetArr) {
  for (let r = 0; r < sheetArr.length; r++) {
    const cellA = sheetArr[r][0];
    if (cellA && String(cellA).trim() === 'Account Head') return r;
  }
  return -1;
}

function findRawSheet(workbook) {
  for (const name of workbook.SheetNames) {
    const ws = workbook.Sheets[name];
    const arr = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    const hr = findHeaderRow(arr);
    if (hr !== -1) return { name, arr, headerRow: hr };
  }
  return null;
}

function extractAsOnDate(headerLines) {
  for (const line of headerLines) {
    const text = String(line[0] || '');
    if (text.includes('As On Date')) {
      const m = text.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s*$/);
      if (m) return excelSerialFromDMY(parseInt(m[1]), parseInt(m[2]), parseInt(m[3]));
    }
  }
  return null;
}

function trimTrailingBlanks(lines) {
  const out = lines.slice();
  while (out.length && (!out[out.length - 1][0] || String(out[out.length - 1][0]).trim() === '')) {
    out.pop();
  }
  return out;
}

function colLetter(n) {
  let s = '';
  while (n > 0) {
    const m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

async function generate(workbook, companyKey) {
  const config = COMPANY_CONFIG[companyKey];
  const found = findRawSheet(workbook);
  if (!found) throw new Error('Could not find a raw ledger sheet (no row with "Account Head" in column A).');
  const { arr, headerRow, name } = found;

  const headerLines = trimTrailingBlanks(arr.slice(0, headerRow));
  const asOnSerial = extractAsOnDate(arr.slice(0, headerRow));

  const colMap = {};
  arr[headerRow].forEach((h, idx) => { if (h) colMap[String(h).trim()] = idx; });

  const required = ['Account Head', 'Invoice No', 'Invoice Date', 'Due Date', 'Net Outstanding', 'Business Unit'];
  for (const req of required) {
    if (!(req in colMap)) throw new Error('Missing expected column in raw sheet: ' + req);
  }
  const provIdx = colMap['Provisional'];

  const records = [];
  const unmapped = new Set();
  let negativeExcluded = 0;
  for (let r = headerRow + 1; r < arr.length; r++) {
    const row = arr[r];
    const account = String(row[colMap['Account Head']] || '').trim();
    if (!account) continue;
    const net = Number(row[colMap['Net Outstanding']]);
    if (isNaN(net)) continue;
    if (net < 0) { negativeExcluded++; continue; }
    const businessUnit = String(row[colMap['Business Unit']] || '').trim();
    if (!config.columns.some(c => c.unit === businessUnit)) unmapped.add(businessUnit);
    records.push({
      account,
      invoiceNo: row[colMap['Invoice No']],
      invoiceDate: row[colMap['Invoice Date']],
      dueDate: row[colMap['Due Date']],
      netOutstanding: net,
      businessUnit,
      provisional: provIdx !== undefined ? row[provIdx] : ''
    });
  }

  function groupByVendor(recs) {
    const sorted = recs.slice().sort((a, b) => {
      const an = a.account.toLowerCase(), bn = b.account.toLowerCase();
      if (an < bn) return -1;
      if (an > bn) return 1;
      return (a.invoiceDate || 0) - (b.invoiceDate || 0);
    });
    const out = [];
    let i = 0;
    while (i < sorted.length) {
      let j = i;
      while (j < sorted.length && sorted[j].account === sorted[i].account) j++;
      out.push(sorted.slice(i, j));
      i = j;
    }
    return out;
  }

  const THRESHOLD = 5000;
  // Classify by each vendor's TOTAL outstanding across all their invoices,
  // not by each invoice individually - otherwise a vendor with several
  // invoices each under the threshold, but summing above it, would end up
  // sitting entirely in the "below" section (and a vendor could even be
  // split across both sections if their invoices straddled the threshold).
  const allGroups = groupByVendor(records);
  const groupsAbove = [];
  const groupsBelow = [];
  for (const group of allGroups) {
    const vendorTotal = group.reduce((sum, r) => sum + r.netOutstanding, 0);
    if (vendorTotal > THRESHOLD) groupsAbove.push(group);
    else groupsBelow.push(group);
  }

  return { sourceSheet: name, headerLines, asOnSerial, config, groupsAbove, groupsBelow, threshold: THRESHOLD, unmapped: Array.from(unmapped), negativeExcluded };
}

async function buildAndOffer(result, companyKey, sourceFileName) {
  const { headerLines, asOnSerial, config, groupsAbove, groupsBelow, threshold, unmapped, negativeExcluded, sourceSheet } = result;

  const countInvoices = g => g.reduce((a, grp) => a + grp.length, 0);
  logRow('Source sheet detected', sourceSheet);
  logRow('As On date detected', asOnSerial ? excelSerialToDisplay(asOnSerial) : 'Not found — check header text', asOnSerial ? 'ok' : 'warn');
  logRow(`Bills above ₹${threshold.toLocaleString('en-IN')}`, `${countInvoices(groupsAbove)} invoices, ${groupsAbove.length} vendors`);
  logRow(`Bills ₹${threshold.toLocaleString('en-IN')} and below`, `${countInvoices(groupsBelow)} invoices, ${groupsBelow.length} vendors`);
  logRow('Negative-value rows excluded', negativeExcluded);
  if (unmapped.length) {
    const div = document.createElement('div');
    div.className = 'warn';
    div.style.marginTop = '6px';
    div.innerHTML = 'Business units not in the fixed project list (check mapping):<ul class="unmapped-list">' +
      unmapped.map(u => `<li>${u || '(blank)'}</li>`).join('') + '</ul>';
    logEl.appendChild(div);
  }

  const outWb = new ExcelJS.Workbook();
  const ws = outWb.addWorksheet('Structured');

  const thin = { style: 'thin', color: { argb: 'FFB7C0C8' } };
  const border = { top: thin, left: thin, bottom: thin, right: thin };
  const navy = 'FF1F3B57';
  const bandTint = 'FFDCE6F1';
  const gold = 'FFFFD966';
  const categoryTint = 'FF2E4A6B';

  const companyLine = headerLines.find(l => String(l[0] || '').trim().startsWith('Company:'));
  const companyFullNames = { MMP: 'MICROMEGA PROJECTS', NLS: 'NAGJUA LIFESPACES', SPCT: 'SPRING CITY DEVELOPERS' };
  const companyFullName = companyLine ? String(companyLine[0]).replace('Company:', '').trim() : (companyFullNames[companyKey] || companyKey);
  const dateDisplay = asOnSerial ? excelSerialToDisplay(asOnSerial) : 'not detected';

  const splitStartCol = 10;
  const totalCol = 10 + config.columns.length;

  ws.mergeCells(1, 1, 1, totalCol);
  const titleCell = ws.getCell(1, 1);
  titleCell.value = `${companyFullName} — CREDITOR OUTSTANDING REPORT`;
  titleCell.font = { name: 'Calibri', size: 13, bold: true, color: { argb: 'FFFFFFFF' } };
  titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: navy } };
  titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
  ws.getRow(1).height = 24;

  ws.mergeCells(2, 1, 2, totalCol);
  const subCell = ws.getCell(2, 1);
  subCell.value = `As on ${dateDisplay}`;
  subCell.font = { name: 'Calibri', size: 11, bold: true, color: { argb: navy } };
  subCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bandTint } };
  subCell.alignment = { horizontal: 'center', vertical: 'middle' };
  ws.getRow(2).height = 18;

  const accountingFmt = '_ * #,##0.00_ ;_ * \\-#,##0.00_ ;_ * "-"??_ ;_ @_ ';
  const dateFmt = 'dd-mmm-yy';
  const dateParts = asOnSerial ? (() => { const d = new Date(Date.UTC(1899, 11, 30) + asOnSerial * 86400000); return [d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()]; })() : null;
  const headers = ['Account Head', 'Invoice No', 'Invoice Date', 'Due Date', 'CREDIT OVERDUE', 'CREDIT PERIOD',
    'Net Outstanding', 'Business Unit', 'Provisional', ...config.columns.map(c => c.label), 'TOTAL'];

  // Writes one category (banner + column headers + vendor groups/subtotals +
  // a grand total for just this category) starting at startRow, and returns
  // the row number right after it (with a blank spacer row already included).
  function writeCategory(startRow, label, groups) {
    let rowIdx = startRow;

    ws.mergeCells(rowIdx, 1, rowIdx, totalCol);
    const bannerCell = ws.getCell(rowIdx, 1);
    bannerCell.value = label;
    bannerCell.font = { name: 'Calibri', size: 12, bold: true, color: { argb: 'FFFFFFFF' } };
    bannerCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: categoryTint } };
    bannerCell.alignment = { horizontal: 'left', vertical: 'middle', indent: 1 };
    ws.getRow(rowIdx).height = 22;
    rowIdx++;

    const headerRowNum = rowIdx;
    headers.forEach((h, idx) => {
      const c = ws.getCell(headerRowNum, idx + 1);
      c.value = h;
      c.font = { name: 'Calibri', size: 11, bold: true, color: { argb: 'FFFFFFFF' } };
      c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: navy } };
      c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      c.border = border;
    });
    ws.getRow(headerRowNum).height = 30;
    rowIdx++;

    const firstDataRow = rowIdx;
    if (!groups.length) {
      ws.mergeCells(rowIdx, 1, rowIdx, totalCol);
      const emptyCell = ws.getCell(rowIdx, 1);
      emptyCell.value = 'No bills in this category.';
      emptyCell.font = { name: 'Calibri', size: 11, italic: true, color: { argb: 'FF667080' } };
      emptyCell.alignment = { horizontal: 'left', vertical: 'middle', indent: 1 };
      for (let col = 1; col <= totalCol; col++) ws.getCell(rowIdx, col).border = border;
      rowIdx++;
    }

    for (const group of groups) {
      const isMulti = group.length > 1;
      if (isMulti) rowIdx++;
      const groupStartRow = rowIdx;
      for (const rec of group) {
        const r = rowIdx;
        const setCell = (col, value, opts) => {
          const cell = ws.getCell(r, col);
          cell.value = value;
          cell.font = { name: 'Calibri', size: 11 };
          cell.border = border;
          if (opts && opts.numFmt) cell.numFmt = opts.numFmt;
          if (opts && opts.align) cell.alignment = opts.align;
        };
        setCell(1, rec.account);
        setCell(2, rec.invoiceNo);
        setCell(3, rec.invoiceDate ? new Date(Date.UTC(1899, 11, 30) + rec.invoiceDate * 86400000) : null, { numFmt: dateFmt });
        setCell(4, rec.dueDate ? new Date(Date.UTC(1899, 11, 30) + rec.dueDate * 86400000) : null, { numFmt: dateFmt });
        setCell(5, dateParts ? { formula: `DATE(${dateParts[0]},${dateParts[1]},${dateParts[2]})-D${r}` } : null, { align: { horizontal: 'center' } });
        setCell(6, { formula: `D${r}-C${r}` }, { align: { horizontal: 'center' } });
        setCell(7, rec.netOutstanding, { numFmt: '#,##0.00' });
        setCell(8, rec.businessUnit);
        setCell(9, rec.provisional || '', { align: { horizontal: 'center' } });
        config.columns.forEach((col, ci) => {
          setCell(splitStartCol + ci, { formula: `IF(H${r}="${col.unit}",G${r},0)` }, { numFmt: accountingFmt });
        });
        const colLetters = config.columns.map((c, ci) => colLetter(splitStartCol + ci));
        setCell(totalCol, { formula: colLetters.map(cl => `${cl}${r}`).join('+') }, { numFmt: accountingFmt });
        rowIdx++;
      }
      if (isMulti) {
        const groupEndRow = rowIdx - 1;
        for (let col = 1; col <= totalCol; col++) {
          const cell = ws.getCell(rowIdx, col);
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bandTint } };
          cell.border = border;
          cell.font = { name: 'Calibri', size: 11, bold: true };
        }
        ws.getCell(rowIdx, 8).value = 'TOTAL';
        const gCell = ws.getCell(rowIdx, 7);
        gCell.value = { formula: `SUBTOTAL(9,G${groupStartRow}:G${groupEndRow})` };
        gCell.numFmt = '#,##0.00';
        for (let ci = 0; ci < config.columns.length; ci++) {
          const cl = colLetter(splitStartCol + ci);
          const cell = ws.getCell(rowIdx, splitStartCol + ci);
          cell.value = { formula: `SUBTOTAL(9,${cl}${groupStartRow}:${cl}${groupEndRow})` };
          cell.numFmt = accountingFmt;
        }
        const tcl = colLetter(totalCol);
        const tCell = ws.getCell(rowIdx, totalCol);
        tCell.value = { formula: `SUBTOTAL(9,${tcl}${groupStartRow}:${tcl}${groupEndRow})` };
        tCell.numFmt = accountingFmt;
        rowIdx++;
      }
    }

    const lastDataRow = rowIdx - 1;
    if (groups.length) {
      const grandRow = rowIdx;
      for (let col = 1; col <= totalCol; col++) {
        const cell = ws.getCell(grandRow, col);
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: gold } };
        cell.border = border;
        cell.font = { name: 'Calibri', size: 12, bold: true, color: { argb: navy } };
      }
      ws.getCell(grandRow, 1).value = 'GRAND TOTAL';
      ws.getCell(grandRow, 7).value = { formula: `SUBTOTAL(9,G${firstDataRow}:G${lastDataRow})` };
      ws.getCell(grandRow, 7).numFmt = '#,##0.00';
      const tcl = colLetter(totalCol);
      ws.getCell(grandRow, totalCol).value = { formula: `SUBTOTAL(9,${tcl}${firstDataRow}:${tcl}${lastDataRow})` };
      ws.getCell(grandRow, totalCol).numFmt = accountingFmt;
      ws.getRow(grandRow).height = 20;
      rowIdx++;
    }

    rowIdx += 2; // blank spacer rows before the next category
    return { nextRow: rowIdx, headerRowNum };
  }

  let cursor = 4;
  const aboveResult = writeCategory(cursor, `BILLS ABOVE ₹${threshold.toLocaleString('en-IN')}`, groupsAbove);
  cursor = aboveResult.nextRow;
  const belowResult = writeCategory(cursor, `BILLS ₹${threshold.toLocaleString('en-IN')} AND BELOW`, groupsBelow);
  cursor = belowResult.nextRow;

  ws.getColumn(1).width = 32;
  ws.getColumn(2).width = 18;
  ws.getColumn(3).width = 12;
  ws.getColumn(4).width = 12;
  ws.getColumn(5).width = 14;
  ws.getColumn(6).width = 12;
  ws.getColumn(7).width = 14;
  ws.getColumn(8).width = 26;
  ws.getColumn(9).width = 10;
  for (let ci = 0; ci < config.columns.length; ci++) ws.getColumn(splitStartCol + ci).width = 12;
  ws.getColumn(totalCol).width = 14;
  ws.eachRow(row => { row.eachCell({ includeEmpty: false }, cell => { if (!cell.font) cell.font = { name: 'Calibri', size: 11 }; }); });

  ws.views = [{ state: 'frozen', ySplit: aboveResult.headerRowNum }];

  const arrBuf = await outWb.xlsx.writeBuffer();
  const blob = new Blob([arrBuf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const baseName = sourceFileName.replace(/\.xlsx$/i, '');
  const outName = `${companyKey}_Creditor_Structured_${baseName}.xlsx`;
  const a = document.createElement('a');
  a.href = url;
  a.download = outName;
  a.className = 'dl';
  a.textContent = '⬇ Download ' + outName;
  logEl.appendChild(a);
}

function excelSerialToDisplay(serial) {
  const d = new Date(Date.UTC(1899, 11, 30) + serial * 86400000);
  const dd = String(d.getUTCDate()).padStart(2, '0');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${dd}-${months[d.getUTCMonth()]}-${d.getUTCFullYear()}`;
}
</script>
